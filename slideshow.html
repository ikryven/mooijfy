<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>mooijfy gallery — slideshow</title>
<style>
  :root { --purple:#6d4aff; --purple-dark:#5a3ad6; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body { font-family: system-ui, Arial, sans-serif; background:#16143a; color:#fff; overflow:hidden; }

  .stage {
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .slide-img {
    max-width:100vw; max-height:100vh;
    object-fit:contain;
    opacity:0; transition:opacity .25s ease;
    background:#fff;
  }
  .slide-img.visible { opacity:1; }

  /* Hidden by default, shown only when needed */
  .help-btn { display:none; }
  .help-btn.shown { display:flex; }

  .controls {
    position:fixed; bottom:18px; left:0; right:0;
    display:flex; align-items:center; justify-content:center; gap:10px;
    z-index:10;
    padding:0 16px;
  }
  .btn {
    background:var(--purple); color:#fff; border:none; border-radius:50%;
    width:52px; height:52px; font-size:22px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    touch-action:manipulation; user-select:none;
    box-shadow:0 2px 10px rgba(0,0,0,.45);
    flex:none;
  }
  .btn:hover:not(:disabled) { background:var(--purple-dark); }
  .btn:disabled { background:#55506e; cursor:default; }
  .btn-round-sm { width:44px; height:44px; font-size:18px; }

  .counter {
    background:rgba(255,255,255,.12); border-radius:18px;
    padding:8px 16px; font-size:14px; color:#eee;
    min-width:80px; text-align:center;
  }

  .caption {
    position:fixed; top:18px; left:50%; transform:translateX(-50%);
    background:rgba(22,14,52,.85); border:1px solid #6d4aff66;
    border-radius:8px; padding:10px 18px; font-size:16px;
    max-width:min(85vw, 640px); text-align:center;
    display:none; z-index:10; backdrop-filter:blur(4px);
    pointer-events:none;
  }
  .caption.visible { display:block; }
  .caption .comment { display:block; font-size:13px; color:#c9c2ee; margin-top:2px; }

  .status {
    position:fixed; top:14px; left:14px; z-index:10;
    font-size:13px; color:#cfc7f5; background:rgba(22,14,52,.7);
    padding:6px 12px; border-radius:6px; display:none;
  }

  @media (max-width: 480px) {
    .btn { width:46px; height:46px; font-size:20px; }
    .btn-round-sm { width:40px; height:40px; font-size:16px; }
    .counter { font-size:12px; min-width:64px; padding:6px 12px; }
    .controls { bottom:12px; }
  }
</style>
</head>
<body>

<div class="stage">
  <img id="slide" class="slide-img" alt="">
</div>

<div class="caption" id="caption">
  <span id="capName"></span>
  <span class="comment" id="capComment"></span>
</div>

<div class="status" id="statusEl"></div>

<div class="controls">
  <button class="btn btn-round-sm help-btn" id="helpBtn" title="Show/hide title">?</button>
  <button class="btn" id="prevBtn" title="Previous">&lsaquo;</button>
  <span class="counter" id="counter">– / –</span>
  <button class="btn" id="nextBtn" title="Next">&rsaquo;</button>
</div>

<script>
(function () {
  'use strict';

  var CFG = { imgDir: 'imgs', manifest: 'slideshow.json', captions: 'imgs/captions.json' };

  var items = [], idx = 0;
  var $ = function (id) { return document.getElementById(id); };
  var slideEl = $('slide');
  var hasCaptions = false;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function imageUrl(item) {
    if (item.url) return item.url;
    var f = item.file;
    if (/^(https?:|data:|blob:|\/)/i.test(f)) return f;
    return CFG.imgDir.replace(/\/+$/, '') + '/' + f.replace(/^\/+/, '');
  }
  function normalizeManifest(data) {
    var arr = Array.isArray(data) ? data : (data && (data.images || data.items)) || [];
    return arr.map(function (it) {
      if (typeof it === 'string') return { file: it, name: '', comment: '' };
      return { file: it.file || '', url: it.url || '', name: it.name || '', comment: it.comment || '' };
    }).filter(function (it) { return it.file || it.url; });
  }

  function showStatus(msg) { var s = $('statusEl'); s.innerHTML = msg; s.style.display = 'inline-block'; }

  function setCaption() {
    var it = items[idx];
    var capEl = $('caption');
    $('capName').textContent = it.name || '';
    $('capComment').textContent = it.comment || '';
    // Show caption overlay only if this slide has a title
    if (it.name || it.comment) {
      capEl.classList.add('visible');
      $('helpBtn').classList.add('shown');
    } else {
      capEl.classList.remove('visible');
      $('helpBtn').classList.remove('shown');
    }
  }

  function render() {
    var it = items[idx];
    $('prevBtn').disabled = idx === 0;
    $('nextBtn').disabled = idx === items.length - 1;
    $('counter').textContent = (idx + 1) + ' / ' + items.length;

    // fade out old, load new
    slideEl.classList.remove('visible');
    var im = new Image();
    im.onload = function () {
      slideEl.src = im.src;
      void slideEl.offsetWidth; // restart transition
      slideEl.classList.add('visible');
      setCaption();
    };
    im.onerror = function () {
      showStatus('Could not load ' + esc(it.file || it.url));
    };
    im.src = imageUrl(it);
  }

  function go(delta) {
    var n = idx + delta;
    if (n < 0 || n >= items.length) return;
    idx = n;
    render();
  }

  function toggleCaption() { 
    if (!hasCaptions) return;
    $('caption').classList.toggle('visible');
  }

  function loadGallery() {
    if (location.protocol === 'file:') {
      showStatus('Open via a web server to load slideshow.json.');
      return;
    }
    fetch(CFG.manifest, { cache: 'no-store' })
      .then(function (r) { 
        if (!r.ok) throw new Error('not found: ' + CFG.manifest); 
        return r.json(); 
      })
      .then(function (data) {
        items = normalizeManifest(data);
        
        // Check if any captions exist before loading optional captions file
        var hasAnyCaps = items.some(function(it) {
          return (it.name && it.name.trim()) || (it.comment && it.comment.trim());
        });
        
        if (hasAnyCaps) {
          hasCaptions = true;
          return fetch(CFG.captions, { cache: 'no-store' })
            .then(function (cr) { return cr.ok ? cr.json() : {}; })
            .catch(function () { return {}; })
            .then(function (caps) {
              Object.keys(caps).forEach(function (k) {
                items.forEach(function (it) {
                  if (it.file === k) {
                    it.name = it.name || caps[k].name || '';
                    it.comment = it.comment || caps[k].caption || caps[k].comment || '';
                  }
                });
              });
              return items;
            });
        }
        return items;
      })
      .then(function () {
        if (!items.length) { 
          showStatus('No images in slideshow.json.'); 
          return; 
        }
        showStatus(items.length + ' slide(s) loaded');
        setTimeout(function() { $('statusEl').style.display = 'none'; }, 2000);
        render();
      })
      .catch(function (err) { 
        showStatus(err.message || 'Could not load slideshow.json'); 
      });
  }

  $('prevBtn').addEventListener('click', function () { go(-1); });
  $('nextBtn').addEventListener('click', function () { go(1); });
  $('helpBtn').addEventListener('click', toggleCaption);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === '?' || e.key === '/') toggleCaption();
  });

  // touch swipe with better thresholds for mobile
  var startX = null;
  var startY = null;
  
  document.addEventListener('touchstart', function (e) { 
    if (e.touches.length === 1) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }
  }, { passive:true });
  
  document.addEventListener('touchend', function (e) {
    if (startX === null) return;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    
    // Only trigger swipe if horizontal movement > vertical (avoid scroll interference)
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 50) go(-1);     // swipe right = prev
      else if (dx < -50) go(1); // swipe left = next
    }
    startX = null;
    startY = null;
  });

  // Prevent double-tap zoom
  document.addEventListener('dblclick', function (e) { 
    e.preventDefault(); 
  }, { passive:false });

  loadGallery();
})();
</script>
</body>
</html>
